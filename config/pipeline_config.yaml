# config/pipeline_config.yaml

# 0) optional auth (kept null by default)
auth:
  ccdi_api_token: null              # not needed currently
  cbioportal_api_token: null        # or set via env CBIOPORTAL_API_TOKEN
  pedcbioportal_api_token: null     # replace with your API token

# 1) services (you already have these)
services:
  ccdi_sample_diagnosis: "https://federation.ccdi.cancer.gov/api/v1/sample-diagnosis"
  ccdi_subject_diagnosis: "https://federation.ccdi.cancer.gov/api/v1/subject-diagnosis"
  cbioportal_api: "https://www.cbioportal.org/api"
  cbioportal_swagger: "https://www.cbioportal.org/api/v2/api-docs"
  pedcbioportal_api: "https://pedcbioportal.kidsfirstdrc.org/api"
  pedcbioportal_swagger: "https://pedcbioportal.kidsfirstdrc.org/api/v2/api-docs"

# 2) source filter (null = all)
target_source: null   # "PCDC" | "Treehouse" | "StJude" | "KidsFirst" | "ccdi-ecDNA"

# 3) paging / HTTP
per_page: 100        # records per CCDI request. Larger pages need fewer requests but each takes longer
                     # (raise timeout too); if search_skipped.tsv lists "Incomplete", go back to 100.
verbose: true
consider_overlap: false
timeout: 60          # seconds per request; slow CCDI sources may need 120
retry_status: [429, 500, 502, 503, 504]
rate_limit:
  sleep_seconds: 0.0   # bump to e.g. 0.2 if you hit 429s a lot

# 4) fixed cancer term lists: used when search.source is "config", and as the
#    baseline in the ontology-vs-fixed-list report (search_report.tsv)
default_type_terms:
  Wilms Tumor:
    - "wilms"
    - "nephroblastoma"
    - "8960/3 : Nephroblastoma, NOS"
  Glioma:
    - "glioma"
    - "high-grade glioma"
    - "low-grade glioma"

custom_type_terms: {}
  # Neuroblastoma:
  #   - "neuroblastoma"
  #   - "nbl"

# 4b) Optional: CCDI search terms from the ontology layer (src/ontology_search.py).
#     Off by default: data_fetch searches with the fixed lists above.
search:
  use_ontology: false         # true: query terms and cohort membership from config/ontology (NCIt concept
                              #   set of the cohort + labels and ICD-O-3 codes in the SSSOM files).
                              #   More and broader queries, so data_fetch takes much longer.
  cohorts:                    # cancer type -> NCIt concept set in config/ontology/analysis_groups.tsv
    "Wilms Tumor": wilms_tumor
    "Glioma": glioma
  include_unresolved: true    # keep a value that resolves to no concept but contains a cohort term
                              #   (marked term_only in search_values.tsv, for curation)
  compare_with_config: true   # also query the fixed lists; write search_report.tsv / search_values.tsv
  min_length: 4               # shorter terms are not used
  query_codes: false          # ICD-O-3 codes are not sent as separate queries when their label is already
                              #   searched (CCDI writes "9421/1 : Pilocytic astrocytoma"); true = send them too
  max_workers: 1              # CCDI queries in parallel; >1 is faster but the federation API may time out

# 5) which types you want right now
cancer_type_interest:
  - "Wilms Tumor"
#  - "Glioma"

# 6) study IDs (used when writing idmap parquet)
cBio_studyId:
  "Wilms Tumor": "wt_target_2018_pub"
  "Glioma": "brain_cptac_2020"
# pedcBio_studyId:
#  "Wilms Tumor": null
#  "Glioma": "pbta_all"

# What expression profiles to pull for each type
# valid keys: mrna, mirna, methylation, linear_cna
expression_profiles:
  "Wilms Tumor": [mrna, mirna, methylation]
  "Glioma": [mrna, linear_cna]

# 7) Processor label settings (per cancer type)
processor:
  labels:
    Wilms Tumor:
      source: samples
      column: HISTOLOGY_CLASSIFICATION_IN_PRIMARY_TUMOR
      map: "FHWT=0,DAWT=1"
      # one value per modality, in the order of expression_profiles: mrna, mirna, methylation
      # (values used for the manuscript: Table 3)
      var_threshold: [0.1, 0.05, 0.01]
      alpha: [0.05, 0.1, 0.05]
      top_k: [1000, 500, 500]
      fdr_fallback: true        # fewer than top_k pass FDR -> top_k by ANOVA F after the variance filter
      test_size: 0.2
      seed: 42
    Glioma:
      source: samples
      column: CANCER_TYPE
      map: "low-grade=0,high-grade=1"
      # mrna, linear_cna
      var_threshold: [0.1, 0.01]
      alpha: [0.05, 0.10]
      top_k: [1000, 1000]
      fdr_fallback: true
      test_size: 0.2
      seed: 42

# 10) graph_constructor.py
patient_similarity_graph:
  edges_per_node: 5  
  save_graphml: false 

# 11) graph_ai_model.py
model_mogonet:
  mode: train                 # or infer
  checkpoints_dir: data/models
  edges_per_node: 5
  gcn_hidden: [400, 400, 200]
  epochs: { pretrain: 50, train: 400 }
  lr: { enc_pretrain: 1.0e-3, enc: 5.0e-4, clf: 1.0e-3 }
  device: cpu
  clinical_view:
    enabled: true
    # Choose any columns that appear in processor’s clinical_train/test.parquet
    features: [AGE, CLINICAL_STAGE, RACE, SEX, ETHNICITY]

# 12) post_analysis.py
post_analysis:
  survival:
    enabled: true
    group_col: HISTOLOGY_CLASSIFICATION_IN_PRIMARY_TUMOR   # column in clinical_patients.csv
    time_col: OS_MONTHS
    status_col: OS_STATUS
    title: "Overall Survival by Histology"
    out_dir: data/analysis/km

  feature_selection:
    enabled: true
    edges_per_node: 5
    out_dir: data/analysis/feature_selection

# 13) benchmark.py: stratified k-fold cross-validation with one seed (run on demand:
#     python -m src.main --call benchmark). MOGONET uses the model_mogonet settings above.
benchmark:
  n_splits: 5
  seed: 42                      # one seed: StratifiedKFold shuffle + MOGONET / Random Forest initialization
  sd_ddof: 1                    # SD over the n_splits folds: 1 = sample SD (pandas), 0 = population SD (numpy.std)
  models: [mogonet, naive_bayes, random_forest]
  feature_selection: in_fold    # in_fold: refit processor feature selection on each training fold
                                # precomputed: reuse data_process outputs (selected on all patients)
  naive_bayes: {}               # sklearn GaussianNB arguments
  random_forest: { n_estimators: 100, n_jobs: -1 }   # sklearn RandomForestClassifier arguments; random_state = seed
  out_dir: data/analysis/benchmark
