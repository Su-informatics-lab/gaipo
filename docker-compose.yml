# DockerImage/docker-compose.yaml
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: gaipo:latest
    environment:
      - CONFIG_PATH=/app/config/pipeline_config.yaml
      - GDC_MAPPING_PATH=/app/config/gdc_mapping.yaml
      # Tokens are passed from the host environment (or a git-ignored .env file next to
      # this file); keep auth.* in config/pipeline_config.yaml null so no token is committed.
      - PEDCBIOPORTAL_API_TOKEN=${PEDCBIOPORTAL_API_TOKEN:-}
      - CBIOPORTAL_API_TOKEN=${CBIOPORTAL_API_TOKEN:-}
      # - GDC_API_TOKEN=${GDC_API_TOKEN}
    volumes:
      - ./config:/app/config:ro
      - ./src:/app/src:rw
      - ./data:/app/data:rw
    working_dir: /app
    # convenient default: list the help
    command: ["python", "-m", "src.main", "--help"]